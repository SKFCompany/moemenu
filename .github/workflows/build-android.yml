name: Build Android APK

# Когда запускается сборка:
# 1. Автоматически при пуше в main/master (если поменялся код приложения
#    или сам buildozer.spec — не пересобираем зря на правки README и т.п.)
# 2. Вручную из вкладки Actions на GitHub кнопкой "Run workflow"
on:
  push:
    branches: [ main, master ]
    paths:
      - "**.py"
      - "buildozer.spec"
      - "requirements.txt"
      - "assets/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch: {}

jobs:
  build:
    # Фиксируем конкретную LTS-версию Ubuntu (не "ubuntu-latest") — иначе
    # рано или поздно GitHub переключит "latest" на новый релиз с другими
    # версиями системных пакетов, и сборка отвалится без единой правки в
    # самом проекте (именно это и случилось со сторонним Docker-экшеном:
    # он пытался подключить PPA для Ubuntu-релиза, которого тот PPA ещё не
    # поддерживает).
    runs-on: ubuntu-22.04
    steps:
      - name: Скачать код репозитория
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Системные зависимости buildozer/python-for-android по официальной
      # документации: https://buildozer.readthedocs.io/en/latest/installation.html
      # openjdk-17-jdk здесь ставится из штатного репозитория Ubuntu 22.04,
      # без сторонних PPA — то, что как раз ломалось в Docker-образе экшена.
      - name: Установить системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk-headless \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses-dev cmake libffi-dev libssl-dev \
            build-essential ccache

      - name: Установить buildozer и Cython
        run: |
          pip install --upgrade pip
          pip install buildozer==1.6.0 cython==0.29.36

      # buildozer при первой сборке скачивает и компилирует Android SDK/NDK
      # и все Python-зависимости под Android — это может занимать 30-60+
      # минут. Кэш ускоряет все последующие сборки до нескольких минут.
      - name: Кэш buildozer (Android SDK/NDK, python-for-android)
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Собрать APK (buildozer android debug)
        run: |
          set -o pipefail
          yes | buildozer android debug 2>&1 | tee build.log

      # Срабатывает только если предыдущий шаг упал. GitHub обрезает вывод
      # шага в интерфейсе, поэтому здесь отдельно печатаем ~100 строк вокруг
      # первого "error" из полного лога (build.log), плюс хвост лога —
      # этого обычно достаточно, чтобы увидеть причину без скачивания raw log.
      - name: Показать причину падения сборки
        if: failure()
        run: |
          echo "════════════════════════════════════════════════════════"
          echo " 100 строк начиная с первой найденной ошибки"
          echo "════════════════════════════════════════════════════════"
          awk 'BEGIN{IGNORECASE=1} /error[: ]|error$/{if(!found){found=1}} found{print; c++} c>=100{exit}' build.log

          echo ""
          echo "════════════════════════════════════════════════════════"
          echo " Последние 100 строк лога (на случай, если ошибка не"
          echo " попала под шаблон выше)"
          echo "════════════════════════════════════════════════════════"
          tail -n 100 build.log

      - name: Загрузить полный лог сборки как артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Загрузить APK как артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: moemenu-debug-apk
          path: bin/*.apk
          if-no-files-found: error
